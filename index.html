<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Пляжная Галерея</title>
    <link rel="icon" href="ob.png" type="image/png" />
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            min-height: 100vh;
            background: linear-gradient(180deg, #87CEEB 0%, #F4E3C5 70%, #D2B48C 100%);
            background-attachment: fixed;
            position: relative;
            overflow-x: hidden;
        }

        .wave {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 120px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" preserveAspectRatio="none"><path d="M0,0 C300,80 600,20 900,70 C1100,100 1200,40 1200,40 L1200,120 L0,120Z" fill="rgba(255,255,255,0.3)"/></svg>') repeat-x;
            background-size: 1200px 120px;
            animation: waveMove 8s linear infinite;
            z-index: 0;
            pointer-events: none;
        }
        .wave2 {
            bottom: 40px;
            opacity: 0.5;
            animation-duration: 12s;
            animation-direction: reverse;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" preserveAspectRatio="none"><path d="M0,0 C300,60 600,100 900,50 C1100,10 1200,60 1200,60 L1200,120 L0,120Z" fill="rgba(255,255,255,0.2)"/></svg>');
        }
        @keyframes waveMove {
            0% { background-position-x: 0; }
            100% { background-position-x: 1200px; }
        }

        /* ===== прелоадер ===== */
        #preloader {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            transition: opacity 0.6s ease, visibility 0.6s ease;
            opacity: 1;
            visibility: visible;
        }
        #preloader.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        #preloader .spinner {
            width: 90px;
            height: 90px;
            animation: spin 1.4s linear infinite;
        }
        #preloader .spinner img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #preloader .loader-text {
            font-family: 'Pacifico', cursive;
            color: #3d2c1e;
            font-size: 2rem;
            letter-spacing: 2px;
            text-align: center;
            max-width: 80%;
            margin-top: 16px;
        }

        /* ===== основной контент ===== */
        #mainContent {
            position: relative;
            z-index: 1;
            padding: 0 20px 60px;
            max-width: 1600px;
            margin: 0 auto;
        }

        /* ===== верхняя панель ===== */
        .top-bar {
            position: sticky;
            top: 10px;
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 8px 0;
            margin-bottom: 20px;
        }
        .top-bar-inner {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 12px 18px;
            padding: 8px 28px;
            background: #e8d5c4;
            backdrop-filter: blur(12px);
            border-radius: 60px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.06);
            border: 1px solid rgba(255,255,255,0.3);
            min-width: 300px;
        }

        .nav-btn {
            width: 48px;
            height: 48px;
            border: none;
            border-radius: 50%;
            background: rgba(135, 206, 235, 0.4);
            backdrop-filter: blur(4px);
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            flex-shrink: 0;
        }
        .nav-btn svg {
            width: 100%;
            height: 100%;
            stroke: #f4a460;
            fill: none;
            stroke-width: 3.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: transform 0.15s;
        }
        .nav-btn.home-btn svg {
            fill: #f4a460;
            stroke: #f4a460;
        }
        .nav-btn.fav-btn svg {
            fill: #f4a460;
            stroke: #f4a460;
        }
        .nav-btn:active svg {
            transform: scale(0.85);
        }
        .nav-btn:hover {
            background: rgba(135, 206, 235, 0.7);
            transform: scale(1.05);
        }

        .search-wrap {
            display: flex;
            align-items: center;
            background: rgba(255,255,255,0.3);
            border-radius: 40px;
            padding: 0 18px;
            border: 1px solid rgba(255,255,255,0.3);
            backdrop-filter: blur(4px);
            transition: 0.3s;
            flex: 1;
            min-width: 160px;
        }
        .search-wrap:focus-within {
            background: rgba(255,255,255,0.6);
            box-shadow: 0 0 0 3px rgba(255,215,0,0.2);
        }
        .search-wrap input {
            border: none;
            background: transparent;
            padding: 10px 12px;
            font-size: 1rem;
            font-family: 'Quicksand', sans-serif;
            color: #3d2c1e;
            width: 100%;
            outline: none;
            min-width: 120px;
        }
        .search-wrap input::placeholder {
            color: #7a6a5a;
            opacity: 0.7;
        }
        .search-wrap svg {
            width: 22px;
            height: 22px;
            stroke: #5a4a3a;
            stroke-width: 2;
            fill: none;
            flex-shrink: 0;
        }

        /* ===== категории ===== */
        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
            margin: 10px 0 24px;
            transition: 0.3s;
        }
        .category-grid.hidden { display: none; }
        .category-btn {
            position: relative;
            border: none;
            background: rgba(255,255,255,0.4);
            backdrop-filter: blur(6px);
            cursor: pointer;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
            transition: 0.25s;
            padding: 0;
            aspect-ratio: 1 / 1;
        }
        .category-btn:hover {
            transform: scale(1.04);
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
        }
        .category-btn .preview-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 2px;
            width: 100%;
            height: 100%;
            background: rgba(255,255,255,0.2);
        }
        .category-btn .preview-grid .preview-cell {
            background: rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .category-btn .preview-grid .preview-cell img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .category-btn .cat-label {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 12px 8px;
            background: rgba(0,0,0,0.35);
            backdrop-filter: blur(4px);
            color: #fff;
            font-weight: 600;
            font-size: 1rem;
            letter-spacing: 0.5px;
            text-shadow: 0 1px 4px rgba(0,0,0,0.3);
            font-family: 'Quicksand', sans-serif;
        }

        .breadcrumb {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            align-items: center;
            gap: 4px 10px;
            padding: 6px 0 10px;
            font-size: 0.95rem;
            color: #3d2c1e;
            font-weight: 500;
        }
        .breadcrumb span {
            cursor: pointer;
            padding: 2px 8px;
            border-radius: 4px;
            transition: 0.15s;
            backdrop-filter: blur(2px);
        }
        .breadcrumb span:hover { background: rgba(255,255,255,0.3); }
        .breadcrumb .sep { cursor: default; color: #7a6a5a; }
        .breadcrumb .current { font-weight: 700; color: #2d1c0e; }
        .breadcrumb .random-btn {
            font-family: 'Pacifico', cursive;
            font-size: 1.4rem;
            background: rgba(135, 206, 235, 0.3);
            backdrop-filter: blur(4px);
            border: 2px solid rgba(135, 206, 235, 0.5);
            padding: 6px 24px;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.3s;
            color: #3d2c1e;
            display: inline-block;
            user-select: none;
        }
        .breadcrumb .random-btn:hover {
            background: rgba(135, 206, 235, 0.5);
            transform: scale(1.05);
            box-shadow: 0 4px 16px rgba(135, 206, 235, 0.3);
        }
        .breadcrumb .random-btn:active {
            transform: scale(0.95);
        }

        .subnav {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            padding: 8px 0 20px;
            align-items: center;
            min-height: 20px;
        }
        .subnav .project-btn,
        .subnav .character-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 110px;
            border: none;
            background: rgba(255,255,255,0.3);
            backdrop-filter: blur(6px);
            cursor: pointer;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            transition: 0.25s;
        }
        .subnav .project-btn:hover,
        .subnav .character-btn:hover {
            transform: translateY(-6px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            background: rgba(255,255,255,0.5);
        }
        .subnav .project-btn .thumb,
        .subnav .character-btn .thumb {
            width: 110px;
            height: 110px;
            object-fit: cover;
            border-radius: 16px 16px 0 0;
            background: rgba(255,255,255,0.2);
        }
        .subnav .project-btn .label,
        .subnav .character-btn .label {
            width: 100%;
            padding: 8px 4px;
            background: rgba(255,255,255,0.5);
            text-align: center;
            font-size: 0.75rem;
            font-weight: 600;
            color: #3d2c1e;
            border-top: 1px solid rgba(255,255,255,0.3);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .subnav .character-btn.active .label {
            background: #3d2c1e;
            color: #fff;
        }

        /* ===== галерея ===== */
        .gallery-container {
            max-width: 1600px;
            margin: 0 auto;
        }
        .grid {
            column-count: 5;
            column-gap: 14px;
            padding: 0;
            will-change: contents;
        }
        .grid-item {
            break-inside: avoid;
            margin-bottom: 14px;
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            border: 1px solid rgba(255,255,255,0.4);
            background: rgba(255,255,255,0.3);
            backdrop-filter: blur(4px);
            opacity: 0;
            transform: translateY(-20px) scale(0.95);
            animation: fadeInDown 0.5s ease forwards;
            position: relative;
            will-change: transform, opacity;
        }
        .grid-item:hover {
            transform: scale(1.03) translateY(0);
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
            z-index: 2;
        }
        @keyframes fadeInDown {
            0% {
                opacity: 0;
                transform: translateY(-30px) scale(0.92);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .grid-item img {
            width: 100%;
            height: auto;
            display: block;
        }

        .grid-item .fav-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 50%;
            background: rgba(135, 206, 235, 0.3);
            backdrop-filter: blur(4px);
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px;
            opacity: 0.7;
            transform: scale(0.85);
            z-index: 5;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .grid-item .fav-btn svg {
            width: 100%;
            height: 100%;
            stroke: #f4a460;
            fill: none;
            stroke-width: 2.5;
            stroke-linejoin: round;
            transition: transform 0.3s;
        }
        .grid-item .fav-btn.active svg {
            fill: #f4a460;
            fill-opacity: 0.8;
            stroke: #f4a460;
        }
        .grid-item .fav-btn.active {
            opacity: 1;
            transform: scale(1);
            background: rgba(255, 215, 0, 0.4);
        }
        .grid-item:hover .fav-btn {
            opacity: 1;
            transform: scale(1);
        }
        .grid-item .fav-btn:hover {
            transform: scale(1.15);
            background: rgba(255, 215, 0, 0.5);
        }
        .grid-item .fav-btn.jump {
            animation: starJump 0.5s ease;
        }
        @keyframes starJump {
            0% { transform: scale(0.85); }
            30% { transform: scale(1.3) rotate(20deg); }
            60% { transform: scale(0.9) rotate(-10deg); }
            100% { transform: scale(1) rotate(0); }
        }

        .load-more {
            text-align: center;
            padding: 30px 0 10px;
            display: none;
            font-family: 'Pacifico', cursive;
            letter-spacing: 1px;
        }
        .load-more .beach-spinner {
            display: inline-block;
            width: 80px;
            height: 80px;
            animation: spin 2s linear infinite;
        }
        .load-more .beach-spinner img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .load-more .label {
            display: block;
            margin-top: 8px;
            font-family: 'Quicksand', sans-serif;
            font-size: 0.95rem;
            color: #5a4a3a;
            font-weight: 500;
        }

        /* ===== модалка ===== */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(12px);
            z-index: 999;
            justify-content: center;
            align-items: center;
            padding: 20px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .modal.active {
            display: flex;
            opacity: 1;
        }
        .modal-content {
            position: relative;
            max-width: 90vw;
            max-height: 90vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-content img {
            max-width: 90vw;
            max-height: 85vh;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            object-fit: contain;
            background: rgba(0,0,0,0.3);
        }
        .modal.active .modal-content img {
            transform: scale(1);
        }
        .modal-close {
            position: fixed;
            top: 20px;
            right: 24px;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(8px);
            border: none;
            color: white;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            font-size: 32px;
            cursor: pointer;
            transition: 0.2s;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-close:hover {
            background: rgba(255,77,77,0.7);
            transform: rotate(90deg) scale(1.05);
        }

        .modal-nav {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(135, 206, 235, 0.4);
            backdrop-filter: blur(4px);
            border: none;
            border-radius: 50%;
            width: 70px;
            height: 70px;
            cursor: pointer;
            transition: 0.2s;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px;
            opacity: 0.8;
        }
        .modal-nav:hover {
            background: rgba(135, 206, 235, 0.7);
            opacity: 1;
            transform: translateY(-50%) scale(1.1);
        }
        .modal-nav:active {
            transform: translateY(-50%) scale(0.9);
        }
        .modal-nav svg {
            width: 100%;
            height: 100%;
            stroke: #f4a460;
            fill: none;
            stroke-width: 4;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .modal-nav.prev { left: 20px; }
        .modal-nav.next { right: 20px; }

        /* ===== КНОПКА НАВЕРХ (в правом верхнем углу) ===== */
        .scroll-top-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 56px;
            height: 56px;
            border: none;
            border-radius: 50%;
            background: rgba(135, 206, 235, 0.4);
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
            cursor: pointer;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s, visibility 0.3s, transform 0.2s;
            transform: translateY(-20px);
        }
        .scroll-top-btn.visible {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }
        .scroll-top-btn:hover {
            background: rgba(135, 206, 235, 0.7);
            transform: scale(1.08);
        }
        .scroll-top-btn:active {
            transform: scale(0.92);
        }
        .scroll-top-btn svg {
            width: 100%;
            height: 100%;
            stroke: #f4a460;
            fill: none;
            stroke-width: 3.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .water-drop {
            position: fixed;
            pointer-events: none;
            width: 12px;
            height: 12px;
            background: radial-gradient(circle, rgba(255,255,255,0.9) 0%, rgba(135,206,235,0.6) 100%);
            border-radius: 50%;
            z-index: 10000;
            animation: dropFly 0.8s ease-out forwards;
        }
        @keyframes dropFly {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(var(--tx), var(--ty)) scale(0.2);
            }
        }

        @media (max-width: 1200px) { .grid { column-count: 4; } }
        @media (max-width: 900px) {
            .grid { column-count: 3; }
            .category-grid { grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); }
            .top-bar-inner { padding: 8px 20px; gap: 10px; min-width: auto; }
            .search-wrap input { min-width: 80px; }
            .nav-btn { width: 42px; height: 42px; padding: 6px; }
            .modal-nav { width: 60px; height: 60px; padding: 12px; }
            .scroll-top-btn { width: 48px; height: 48px; padding: 10px; top: 16px; right: 16px; }
        }
        @media (max-width: 600px) {
            .grid { column-count: 2; }
            .top-bar-inner { flex-wrap: wrap; padding: 8px 16px; gap: 8px; }
            .search-wrap { order: 10; width: 100%; max-width: 300px; }
            .search-wrap input { width: 100%; min-width: 60px; }
            .modal-nav { width: 50px; height: 50px; padding: 10px; }
            .modal-nav.prev { left: 8px; }
            .modal-nav.next { right: 8px; }
            .modal-close { top: 12px; right: 12px; width: 40px; height: 40px; font-size: 24px; }
            .category-grid { grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); }
            .subnav .project-btn, .subnav .character-btn { width: 90px; }
            .subnav .project-btn .thumb, .subnav .character-btn .thumb { width: 90px; height: 90px; }
            .breadcrumb .random-btn { font-size: 1.2rem; padding: 4px 16px; }
            .scroll-top-btn { width: 44px; height: 44px; padding: 8px; top: 12px; right: 12px; }
        }
        @media (max-width: 400px) { .grid { column-count: 1; } }
    </style>
</head>
<body>

<!-- ===== ПРЕЛОАДЕР ===== -->
<div id="preloader">
    <div class="spinner"><img src="cir.png" alt="загрузка" /></div>
    <div class="loader-text" id="loaderText">Ищем ракушку</div>
</div>

<!-- ===== ВОЛНЫ ===== -->
<div class="wave"></div>
<div class="wave wave2"></div>

<!-- ===== ОСНОВНОЙ КОНТЕНТ ===== -->
<div id="mainContent" style="display:none;">

    <div class="top-bar">
        <div class="top-bar-inner">
            <button class="nav-btn back-btn" id="backBtn" style="display:none;">
                <svg viewBox="0 0 24 24">
                    <path d="M19 12H5M12 19l-7-7 7-7" stroke="#f4a460" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
            <button class="nav-btn home-btn" id="homeBtn" style="display:none;">
                <svg viewBox="0 0 24 24">
                    <path d="M3 10L12 3l9 7v9a1 1 0 01-1 1H4a1 1 0 01-1-1V10z" stroke="#f4a460" stroke-width="3" fill="#f4a460" fill-opacity="0.8"/>
                </svg>
            </button>
            <button class="nav-btn refresh-btn" id="refreshBtn">
                <svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg>
            </button>
            <button class="nav-btn fav-btn" id="favModeBtn" title="Избранное">
                <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 22 12 18.27 5.82 22 7 14.14l-5-4.87 6.91-1.01L12 2z"/></svg>
            </button>
            <div class="search-wrap">
                <input type="text" id="searchInput" placeholder="Поиск персонажа..." />
                <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            </div>
        </div>
    </div>

    <div class="category-grid" id="categoryGrid"></div>

    <div class="breadcrumb" id="breadcrumb">

// ================================================================

const MAX_FILES = 500;

// Переопределение имён файлов (если отличаются от имени папки)

// Максимальные номера для каждой папки
const folderMax = {};
for (const f of folders) {
    folderMax[f] = MAX_FILES;
}

// ================================================================
// 2. СКАНЕР
// ================================================================

async function scanExistingFiles() {
    const allPaths = [];
    for (const folder of folders) {
        const parts = folder.split('/');
        const category = parts[0];
        let fileBaseName = FILE_NAME_OVERRIDE[folder];
        if (!fileBaseName) fileBaseName = parts[parts.length - 1];
        const maxNum = folderMax[folder] || MAX_FILES;
        for (let i = 1; i <= maxNum; i++) {
            allPaths.push({
                src: folder + '/' + fileBaseName + ' (' + i + ').jpg',
                category: category,
                folder: folder,
                label: fileBaseName + ' (' + i + ')'
            });
        }
    }
    const existing = [];
    for (let i = 0; i < allPaths.length; i += PARALLEL_CHECKS) {
        const chunk = allPaths.slice(i, i + PARALLEL_CHECKS);
        const results = await Promise.all(
            chunk.map(item => new Promise((resolve) => {
                const img = new Image();
                img.onload = () => resolve({ item, exists: true });
                img.onerror = () => resolve({ item, exists: false });
                img.src = item.src;
            }))
        );
        for (const res of results) {
            if (res.exists) existing.push(res.item);
        }
    }
    return existing;
}

// ================================================================
// 3. ФРАЗЫ ДЛЯ ПРЕЛОАДЕРА
// ================================================================

const BEACH_PHRASES = [
    'Ищем ракушку',
    'Волна унесёт к новым приключениям',
    'Солнце осветит горизонт',
    'Каждый горизонт — новое начало',
    'Прибой шепчет тайны',
    'Море вдохновляет',
    'Ветер перемен',
    'Песок хранит истории'
];

// ================================================================
// 4. ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ
// ================================================================

let allArts = [];
let currentCategory = null, currentProject = null, currentCharacter = null;
let currentDisplayArts = [];
let currentIndex = 0;
let loadedCount = 0;
let isLoading = false;
let isFavMode = false;
let favList = JSON.parse(localStorage.getItem('favArts') || '[]');

const preloader = document.getElementById('preloader');
const loaderText = document.getElementById('loaderText');
const mainContent = document.getElementById('mainContent');
const grid = document.getElementById('grid');
const subnav = document.getElementById('subnav');
const breadcrumb = document.getElementById('breadcrumb');
const categoryGrid = document.getElementById('categoryGrid');
const backBtn = document.getElementById('backBtn');
const homeBtn = document.getElementById('homeBtn');
const refreshBtn = document.getElementById('refreshBtn');
const favModeBtn = document.getElementById('favModeBtn');
const searchInput = document.getElementById('searchInput');
const loadMore = document.getElementById('loadMore');
const randomBtn = document.getElementById('randomArtBtn');
const scrollTopBtn = document.getElementById('scrollTopBtn');

// ================================================================
// 5. ВСПОМОГАТЕЛЬНЫЕ
// ================================================================

function shuffle(arr) {
    const shuffled = [...arr];
    for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    return shuffled;
}

function getFilteredArts() {
    let arts = allArts;
    if (isFavMode) {
        arts = arts.filter(a => favList.includes(a.src));
    }
    const query = searchInput.value.trim().toLowerCase();
    if (query) {
        arts = arts.filter(a => a.label.toLowerCase().includes(query) || a.folder.toLowerCase().includes(query));
    }
    if (currentCharacter) {
        arts = arts.filter(a => a.folder.startsWith(currentCharacter));
    } else if (currentProject) {
        arts = arts.filter(a => a.folder.startsWith(currentProject));
    } else if (currentCategory) {
        arts = arts.filter(a => a.category === currentCategory);
    }
    return shuffle(arts);
}

function getColumnCount() {
    const w = window.innerWidth;
    if (w < 400) return 1;
    if (w < 600) return 2;
    if (w < 900) return 3;
    if (w < 1200) return 4;
    return 5;
}

function toggleFavMode() {
    isFavMode = !isFavMode;
    favModeBtn.style.opacity = isFavMode ? '0.7' : '1';
    if (isFavMode) {
        currentCategory = null;
        currentProject = null;
        currentCharacter = null;
        subnav.innerHTML = '';
        updateNavButtons();
        updateBreadcrumb();
    } else {
        goHome();
    }
    resetGallery();
}

function resetGallery() {
    currentDisplayArts = getFilteredArts();
    loadedCount = 0;
    grid.innerHTML = '';
    loadMore.style.display = 'block';
    loadMoreArtworks();
}

function loadMoreArtworks() {
    if (isLoading) return;
    if (loadedCount >= currentDisplayArts.length) {
        loadMore.style.display = 'none';
        return;
    }
    isLoading = true;
    loadMore.style.display = 'block';

    const chunk = currentDisplayArts.slice(loadedCount, loadedCount + ITEMS_PER_LOAD);
    const startIndex = loadedCount;
    loadedCount += chunk.length;

    const cols = getColumnCount();
    const fragment = document.createDocumentFragment();
    const items = [];

    chunk.forEach((item, idx) => {
        const globalIdx = startIndex + idx;
        const row = Math.floor(globalIdx / cols);
        const delay = row * 0.05;

        const div = document.createElement('div');
        div.className = 'grid-item';
        div.style.animationDelay = delay + 's';
        div.style.opacity = '0';
        div.style.transform = 'translateY(-20px) scale(0.95)';
        div.dataset.src = item.src;

        const img = document.createElement('img');
        img.src = item.src;
        img.loading = 'lazy';
        img.onerror = function() { div.remove(); };
        div.appendChild(img);

        const favBtn = document.createElement('button');
        favBtn.className = 'fav-btn' + (favList.includes(item.src) ? ' active' : '');
        const svgStar = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svgStar.setAttribute('viewBox', '0 0 24 24');
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', 'M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 22 12 18.27 5.82 22 7 14.14l-5-4.87 6.91-1.01L12 2z');
        svgStar.appendChild(path);
        favBtn.appendChild(svgStar);
        favBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleFav(item.src, favBtn);
        });
        div.appendChild(favBtn);

        div.addEventListener('click', () => openModal(item.src));

        fragment.appendChild(div);
        items.push(div);
    });

    grid.appendChild(fragment);

    requestAnimationFrame(() => {
        items.forEach((el, i) => {
            el.style.opacity = '';
            el.style.transform = '';
            setTimeout(() => {
                el.style.animation = 'fadeInDown 0.5s ease forwards';
            }, i * 20);
        });
    });

    isLoading = false;
    if (loadedCount < currentDisplayArts.length) {
        loadMore.style.display = 'block';
    } else {
        loadMore.style.display = 'none';
    }
}

function toggleFav(src, btn) {
    const idx = favList.indexOf(src);
    if (idx > -1) {
        favList.splice(idx, 1);
        if (btn) btn.classList.remove('active');
    } else {
        favList.push(src);
        if (btn) {
            btn.classList.add('active');
            btn.classList.remove('jump');
            void btn.offsetWidth;
            btn.classList.add('jump');
            createWaterDrops(btn);
        }
    }
    localStorage.setItem('favArts', JSON.stringify(favList));
    if (isFavMode) resetGallery();
}

function createWaterDrops(btn) {
    const rect = btn.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    const colors = ['rgba(255,255,255,0.9)', 'rgba(135,206,235,0.8)', 'rgba(100,200,255,0.7)', 'rgba(255,215,0,0.5)'];
    for (let i = 0; i < 12; i++) {
        const drop = document.createElement('div');
        drop.className = 'water-drop';
        const angle = Math.random() * 2 * Math.PI;
        const dist = 40 + Math.random() * 70;
        const tx = Math.cos(angle) * dist;
        const ty = Math.sin(angle) * dist - 20;
        drop.style.cssText = `
            left: ${cx + (Math.random() - 0.5) * 10}px;
            top: ${cy + (Math.random() - 0.5) * 10}px;
            width: ${6 + Math.random() * 10}px;
            height: ${6 + Math.random() * 10}px;
            background: radial-gradient(circle, ${colors[i % colors.length]}, rgba(135,206,235,0.3));
            --tx: ${tx}px;
            --ty: ${ty}px;
            animation-duration: ${0.6 + Math.random() * 0.4}s;
        `;
        document.body.appendChild(drop);
        setTimeout(() => drop.remove(), 1200);
    }
}

// ================================================================
// 6. НАВИГАЦИЯ
// ================================================================

function getProjects(category) {
    const projects = new Set();
    for (const art of allArts) {
        if (art.category !== category) continue;
        const parts = art.folder.split('/');
        if (parts.length >= 2) {
            const project = parts.slice(0, 2).join('/');
            projects.add(project);
        }
    }
    return Array.from(projects);
}

function getCharacters(projectPath) {
    const chars = new Set();
    for (const art of allArts) {
        if (!art.folder.startsWith(projectPath + '/')) continue;
        const parts = art.folder.split('/');
        if (parts.length >= 3) {
            const char = parts.slice(0, 3).join('/');
            chars.add(char);
        }
    }
    return Array.from(chars);
}

function getArtsForPath(path) {
    return allArts.filter(art => art.folder.startsWith(path));
}

function getPreviewArts(category, count = 4) {
    let arts = allArts.filter(a => a.category === category);
    arts.sort((a, b) => {
        const aIsMarin = a.folder.includes('Марин') ? 0 : 1;
        const bIsMarin = b.folder.includes('Марин') ? 0 : 1;
        return aIsMarin - bIsMarin;
    });
    const shuffled = shuffle(arts);
    return shuffled.slice(0, count);
}

function renderCategories() {
    const cats = [...new Set(allArts.map(a => a.category))];
    categoryGrid.innerHTML = '';
    cats.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = 'category-btn';
        const preview = document.createElement('div');
        preview.className = 'preview-grid';
        const previewArts = getPreviewArts(cat, 4);
        for (let i = 0; i < 4; i++) {
            const cell = document.createElement('div');
            cell.className = 'preview-cell';
            if (previewArts[i]) {
                const img = document.createElement('img');
                img.src = previewArts[i].src;
                img.alt = '';
                img.onerror = function() { this.style.display = 'none'; };
                cell.appendChild(img);
            }
            preview.appendChild(cell);
        }
        const label = document.createElement('div');
        label.className = 'cat-label';
        label.textContent = cat;
        btn.appendChild(preview);
        btn.appendChild(label);
        btn.addEventListener('click', () => navigateToCategory(cat));
        categoryGrid.appendChild(btn);
    });
}

function renderSubnavItems(items, type, onClick) {
    subnav.innerHTML = '';
    if (!items || items.length === 0) return;
    items.forEach(path => {
        const name = path.split('/').pop();
        const arts = getArtsForPath(path);
        const firstArt = arts.length ? arts[0].src : '';
        const btn = document.createElement('button');
        btn.className = type === 'character' ? 'character-btn' : 'project-btn';
        if (type === 'character' && currentCharacter === path) btn.classList.add('active');
        const thumb = document.createElement('img');
        thumb.className = 'thumb';
        thumb.src = firstArt;
        thumb.alt = name;
        thumb.onerror = function() { this.style.display = 'none'; };
        const label = document.createElement('div');
        label.className = 'label';
        label.textContent = name;
        btn.appendChild(thumb);
        btn.appendChild(label);
        btn.addEventListener('click', () => onClick(path));
        subnav.appendChild(btn);
    });
}

function renderSubnav(projects, characters) {
    if (isFavMode) {
        subnav.innerHTML = '';
        return;
    }
    if (projects && projects.length > 0) renderSubnavItems(projects, 'project', navigateToProject);
    else if (characters && characters.length > 0) renderSubnavItems(characters, 'character', navigateToCharacter);
    else subnav.innerHTML = '';
}

function updateBreadcrumb() {
    let html = '';
    if (isFavMode) {
        html = `<span class="current">⭐ Избранное</span>`;
    } else if (currentCategory) {
        html += `<span data-cat="${currentCategory}">${currentCategory}</span>`;
        if (currentProject) {
            html += `<span class="sep">›</span><span data-project="${currentProject}">${currentProject.split('/').pop()}</span>`;
            if (currentCharacter) html += `<span class="sep">›</span><span class="current">${currentCharacter.split('/').pop()}</span>`;
        }
    } else {
        html = `<span class="current">Все арты</span>`;
    }
    breadcrumb.innerHTML = `<span class="random-btn" id="randomArtBtn">Случайный арт</span>` + (html ? ' | ' + html : '');
    document.getElementById('randomArtBtn').addEventListener('click', showRandomArt);
    breadcrumb.querySelectorAll('[data-cat]').forEach(el => el.addEventListener('click', () => navigateToCategory(el.dataset.cat)));
    breadcrumb.querySelectorAll('[data-project]').forEach(el => el.addEventListener('click', () => navigateToProject(el.dataset.project)));
}

function updateNavButtons() {
    const isHome = !currentCategory && !isFavMode;
    backBtn.style.display = isHome ? 'none' : 'flex';
    homeBtn.style.display = isHome ? 'none' : 'flex';
    categoryGrid.classList.toggle('hidden', isFavMode || (!isHome && !currentCategory));
}

// ================================================================
// 7. НАВИГАЦИЯ
// ================================================================

function navigateToCategory(category) {
    if (isFavMode) return;
    currentCategory = category;
    currentProject = null;
    currentCharacter = null;
    updateBreadcrumb();
    updateNavButtons();
    const projects = getProjects(category);
    renderSubnav(projects, null);
    resetGallery();
}

function navigateToProject(projectPath) {
    if (isFavMode) return;
    currentProject = projectPath;
    currentCharacter = null;
    updateBreadcrumb();
    updateNavButtons();
    const chars = getCharacters(projectPath);
    renderSubnav(null, chars);
    resetGallery();
}

function navigateToCharacter(charPath) {
    if (isFavMode) return;
    currentCharacter = charPath;
    updateBreadcrumb();
    updateNavButtons();
    renderSubnav(null, null);
    resetGallery();
}

function goHome() {
    currentCategory = null;
    currentProject = null;
    currentCharacter = null;
    if (isFavMode) {
        isFavMode = false;
        favModeBtn.style.opacity = '1';
    }
    updateBreadcrumb();
    updateNavButtons();
    renderSubnav(null, null);
    resetGallery();
}

function goBack() {
    if (isFavMode) {
        goHome();
        return;
    }
    if (currentCharacter) {
        const projectPath = currentCharacter.split('/').slice(0, 2).join('/');
        navigateToProject(projectPath);
    } else if (currentProject) {
        const category = currentProject.split('/')[0];
        navigateToCategory(category);
    } else if (currentCategory) {
        goHome();
    }
}

// ================================================================
// 8. СЛУЧАЙНЫЙ АРТ
// ================================================================

function showRandomArt() {
    if (allArts.length === 0) return;
    const pool = currentDisplayArts.length > 0 ? currentDisplayArts : allArts;
    const random = pool[Math.floor(Math.random() * pool.length)];
    openModal(random.src);
}

// ================================================================
// 9. МОДАЛКА
// ================================================================

const modal = document.getElementById('modal');
const modalImage = document.getElementById('modalImage');
const modalClose = document.getElementById('modalClose');
const modalPrev = document.getElementById('modalPrev');
const modalNext = document.getElementById('modalNext');

function openModal(src) {
    const idx = currentDisplayArts.findIndex(a => a.src === src);
    if (idx !== -1) currentIndex = idx;
    else currentIndex = 0;
    showModalImage();
    modal.classList.add('active');
    document.body.style.overflow = 'hidden';
}

function showModalImage() {
    if (currentDisplayArts.length === 0) return;
    const item = currentDisplayArts[currentIndex];
    modalImage.src = item.src;
    modalImage.style.transition = 'none';
    modalImage.style.transform = 'scale(0.9)';
    requestAnimationFrame(() => {
        modalImage.style.transition = 'transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1)';
        modalImage.style.transform = 'scale(1)';
    });
}

function closeModal() {
    modal.classList.remove('active');
    document.body.style.overflow = '';
}

function prevImage() {
    if (currentDisplayArts.length === 0) return;
    currentIndex = (currentIndex - 1 + currentDisplayArts.length) % currentDisplayArts.length;
    showModalImage();
}

function nextImage() {
    if (currentDisplayArts.length === 0) return;
    currentIndex = (currentIndex + 1) % currentDisplayArts.length;
    showModalImage();
}

modalClose.addEventListener('click', closeModal);
modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeModal();
    if (e.key === 'ArrowLeft' && modal.classList.contains('active')) prevImage();
    if (e.key === 'ArrowRight' && modal.classList.contains('active')) nextImage();
});
modalPrev.addEventListener('click', prevImage);
modalNext.addEventListener('click', nextImage);

// ================================================================
// 10. ПРОКРУТКА НАВЕРХ (появляется при скролле, теперь справа сверху)
// ================================================================

window.addEventListener('scroll', () => {
    if (window.scrollY > 300) {
        scrollTopBtn.classList.add('visible');
    } else {
        scrollTopBtn.classList.remove('visible');
    }
});

scrollTopBtn.addEventListener('click', () => {
    window.scrollTo({ top: 0, behavior: 'smooth' });
});

// ================================================================
// 11. ОБРАБОТЧИКИ
// ================================================================

backBtn.addEventListener('click', goBack);
homeBtn.addEventListener('click', goHome);
refreshBtn.addEventListener('click', () => {
    if (isFavMode) return;
    resetGallery();
});
favModeBtn.addEventListener('click', toggleFavMode);

searchInput.addEventListener('input', () => {
    if (isFavMode) return;
    resetGallery();
});

window.addEventListener('scroll', () => {
    if (isLoading) return;
    const loadMoreEl = loadMore;
    if (!loadMoreEl) return;
    const rect = loadMoreEl.getBoundingClientRect();
    if (rect.top < window.innerHeight + 100) {
        loadMoreArtworks();
    }
});

// ================================================================
// 12. ЗАПУСК
// ================================================================

(async function init() {
    const randomPhrase = BEACH_PHRASES[Math.floor(Math.random() * BEACH_PHRASES.length)];
    loaderText.textContent = randomPhrase;

    allArts = await scanExistingFiles();
    console.log(`✅ Найдено артов: ${allArts.length}`);

    favList = JSON.parse(localStorage.getItem('favArts') || '[]');

    mainContent.style.display = 'block';
    renderCategories();
    currentDisplayArts = getFilteredArts();
    loadedCount = 0;
    grid.innerHTML = '';
    loadMore.style.display = 'block';
    loadMoreArtworks();
    updateBreadcrumb();
    updateNavButtons();
    renderSubnav(null, null);

    setTimeout(() => {
        preloader.classList.add('hidden');
    }, 400);
})();
</script>
</body>
</html>
